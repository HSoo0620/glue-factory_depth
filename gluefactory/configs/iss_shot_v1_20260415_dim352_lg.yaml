data:
    name: mitsubishi_v1_20260415_iss_shot
    descriptor_kind: shot
    data_root: /mnt/aict_nas/snuailab_datasets/Feature_Matching/dataset_output
    cache_dir: /home/jhs/work/Registration/glue-factory_depth/gluefactory/datasets/mitsubishi/iss_shot_v1_20260415_cache_vox1_nr20_sr40
    split_json: /home/jhs/work/Registration/glue-factory_depth/gluefactory/datasets/mitsubishi/splits/v1_20260415_split.json
    batch_size: 4
    num_workers: 12
model:
    name: two_view_pipeline
    filter_zero_depth: true
    extractor:
        name: extractors.superpoint_fpfh_cached
        descriptor_dim: 352
        trainable: False
    ground_truth:
        name: matchers.gt_pair_matcher
        gt_radius: 20
    matcher:
        name: matchers.lightglue
        input_dim: 352
        descriptor_dim: 352
        num_heads: 4
        filter_threshold: 0.1
