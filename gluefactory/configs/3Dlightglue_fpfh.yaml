data:
    name: depth_fpfh
    fpfh_radius: 1.5
    batch_size: 64
    num_workers: 8
model:
    name: two_view_pipeline
    extractor:
        name: extractors.superpoint_fpfh_cached
        descriptor_dim: 33
        trainable: False
    ground_truth:
        name: matchers.gt_pair_matcher
        gt_radius: 3
    matcher:
        name: matchers.lightglue
        input_dim: 33       # FPFH 33-dim
        descriptor_dim: 36  # 33→36 최소 projection (head_dim이 짝수여야 함)
        num_heads: 3         # 36 / 3 = 12 (head_dim)
        filter_threshold: 0.1
        flash: false
        checkpointed: true
        weights: null        # pretrained 없이 처음부터 학습
train:
    seed: 0
    epochs: 200
    log_every_iter: 1
    eval_every_iter: 500
    lr: 1e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures_depth']
benchmarks:
    hpatches:
      eval:
        estimator: opencv
        ransac_th: 0.5
