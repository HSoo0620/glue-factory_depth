data:
    name: new_dataset_iss_desc
    descriptor_type: fpfh          # fpfh | shot
    voxel_size: 5.0        # mm; diagnostic winner (pos<neg=0.628)
    fpfh_radius: 50.0      # mm; 1:5:10 with voxel=5, matches SHOT v5
    resize_factor: 0.5
    val_ratio: 0.05
    seed: 0
    batch_size: 32
    num_workers: 12
model:
    name: two_view_pipeline
    filter_zero_depth: true
    extractor:
        name: extractors.superpoint_fpfh_cached
        descriptor_dim: 33
        trainable: False
    ground_truth:
        name: matchers.gt_pair_matcher
        gt_radius: 20
    matcher:
        name: matchers.lightglue
        input_dim: 33
        descriptor_dim: 36
        num_heads: 3
        filter_threshold: 0.1
        flash: false
        checkpointed: true
train:
    seed: 0
    epochs: 100
    best_key: match_recall
    best_key_mode: max
    log_every_iter: 1
    eval_every_iter: 500
    lr: 1.0e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures_depth']
