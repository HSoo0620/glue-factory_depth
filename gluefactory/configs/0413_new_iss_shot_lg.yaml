data:
    name: new_dataset_iss_desc
    descriptor_type: shot
    shot_version: v5               # C++ bins at Descriptor/output_shot_zmap_v5 (voxel=5, normal=25, shot=50 mm)
    resize_factor: 0.5
    val_ratio: 0.05
    seed: 0
    batch_size: 32
    num_workers: 12
model:
    name: two_view_pipeline
    filter_zero_depth: true
    extractor:
        name: extractors.superpoint_fpfh_cached
        descriptor_dim: 352
        trainable: False
    ground_truth:
        name: matchers.gt_pair_matcher
        gt_radius: 20
    matcher:
        name: matchers.lightglue
        input_dim: 352
        descriptor_dim: 36
        num_heads: 3
        filter_threshold: 0.1
        flash: false
        checkpointed: true
train:
    seed: 0
    epochs: 100
    best_key: match_recall
    best_key_mode: max
    log_every_iter: 1
    eval_every_iter: 500
    lr: 1.0e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures_depth']
