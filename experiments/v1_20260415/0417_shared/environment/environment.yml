name: depth_reg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pytorch
  - pytorch-cuda=12.1   # 팀원 GPU CUDA 에 맞춰 조정
